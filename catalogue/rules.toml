# Rules applied to every item the generator writes. Format: catalogue/README.md.

[names]
template_suffix = ".Inkpaws"          # every generated template name ends with this
source_faction = "Folktails"          # re-themed buildings are copies of this faction's blueprints

[poles]
# How poles exist. One line decides it:
#   "plank"  - planks stay planks (Folktails names and icons).
#   "rename" - (chosen 2026-11-14, docs/DESIGN.md) poles ARE the vanilla Plank good, renamed and re-iconed for Inkpaws only through a faction blueprint
#              modifier (proven in game, docs/tech/stage0.md). Nothing is recosted; other mods' buildings keep working.
#   "good"   - poles are a new good (goods.toml, id below) and every cost and ingredient Plank is rewritten to it
#              through [costs].substitute. Needs the PandabornPole good to exist in goods.toml.
mode = "rename"
good = "PandabornPole"                # mode "good": the goods.toml ids that replace Plank and TreatedPlank
cured_good = "PandabornCuredPole"
rename = { Plank = "Poles", TreatedPlank = "Cured poles" }   # mode "rename": vanilla good -> entry in text/goods.json
                                                             # (icon by the naming rule, Sprites/Pandaborn/Goods/<id>sIcon)

[costs]
# Applied to every building cost and every recipe ingredient and product the generator writes. A pair maps a vanilla
# good id to the good the Inkpaws pay instead. mode = "good" above adds Plank -> PandabornPole and
# TreatedPlank -> PandabornCuredPole automatically.
substitute = {}

[modules]
# A code module is on when it ships (src/code/modules.txt) AND its data is ready here. Every catalogue item with
# waits_for = "<Module>" is left out of the build until then (DESIGN.md: nothing in the toolbar lies); its ids stay
# locked and the lock marks them gatedBy. Switch a module on only when its lane has handed over and its data is in
# the catalogue; tools/validate.py fails a release whose shipped modules and data disagree.
Bell = true
Names = true
Look = true
Words = true
Water = false        # data shapes in buildings.toml follow docs/tech/water.md "For the catalogue lane"
Ringtails = true     # docs/tech/two-peoples.md 18.1: adopted 2026-11-14
RingtailsFallback = true
RingtailVenues = false   # Opera Stage and Star Tower: no module runs them yet (two-peoples.md has no venue behaviour)
Festival = false     # docs/tech/events.md 8 (no Festival module in src/code yet)
Flowering = false

[shelves]
# Workplace stores sized in hours of work (docs/tech/two-peoples.md 18.3, measured): night couriers have something to
# carry, and the day crew starts with full inputs. One number each, applied by the generator to every Inkpaw workplace
# (never below vanilla). The playtest lane may bring workshop_hours down to 24 if workshops hoard logs and poles early.
workshop_hours = 48            # recipe CyclesCapacity = ceil(hours x MaxWorkers / cycle hours); FuelCapacity scaled alike
harvest_hours = 16             # flags and farms: output store = ceil(hours x MaxWorkers x harvest_per_worker_hour)
harvest_per_worker_hour = 2.0
