# The Inkpaws tutorial (docs/tech/tutorial.md). One short tutorial per idea, chained by `after`, never two new ideas at
# once. The generator:
#   * adds StartingFactionSpec to the faction (the game's tutorial system runs only for such factions);
#   * switches every vanilla TutorialSpec off for Inkpaws games with a faction modifier (each names Folktails templates,
#     and TutorialService.Load throws on a template the faction lacks);
#   * writes each tutorial below as a dormant base file (RequiredTutorialIds ["PandabornNever"], no stages: Folktails
#     and Iron Teeth games build every TutorialSpec) plus the Inkpaws modifier that gives it its real chain and stages;
#   * writes each stage of ours as a stage blueprint; a stage may also be a vanilla stage id that names no template;
#   * leaves out a stage whose steps name a template the build does not ship (and a tutorial left with no stage), and a
#     tutorial, stage or single step that waits_for a module that is off. Chains skip over left-out tutorials.
# Stage intros come from text/tutorial.json (key Pandaborn.Tutorial.<stage>); step texts are the game's own.
# Step fields per step type: schema/<game>.json (BuildingTutorialStepSpec TemplateNames/OnlyFinishedBuildings/
# RequiredAmount, MarkPlantablesTutorialStepSpec TemplateName/RequiredAmount, SetWorkingHoursStepSpec TargetWorkingHours).

[tutorial]
enabled = true
# the tutorial a stage-less faction would show first; must be one of ours
first = "PandabornBasics"

# The order of play (coordinator, 2026-11-25): a colony starts with no logs, so logs come before anything that costs
# them. Basics and the first lumberjack -> water, gatherer, shoots -> poles -> dens -> a cistern -> the inventor ->
# the Steamer -> the hammock and the bell -> flumes, then rice paddies (when the Water module ships) -> tea -> the
# Lantern Festival (when the Festival module ships). The Moon Loft is a side branch nothing waits for (a village without
# Ringtails is complete). Tutorials whose `after` are all finished run side by side (TutorialService), so only what
# must come first is chained; a tutorial the build leaves out is skipped over (tea follows the bell when Water is off).
[tutorials.PandabornBasics]
order = 0
stages = ["Basics.MoveCamera", "Basics.RotateCamera", "Basics.ZoomCamera", "Basics.ManagePause", "Basics.ManageSpeed", "PandabornTutorial.Lumberjack"]

[tutorials.PandabornWaterAndFood]
order = 10
after = ["PandabornBasics"]
stages = ["PandabornTutorial.Water", "PandabornTutorial.Gatherer", "PandabornTutorial.ShootBamboo"]

[tutorials.PandabornPoles]
order = 20
after = ["PandabornWaterAndFood"]
stages = ["PandabornTutorial.PoleMill", "PandabornTutorial.FirstPoles", "PandabornTutorial.TimberBamboo"]

[tutorials.PandabornHomes]
order = 30
after = ["PandabornPoles"]
stages = ["PandabornTutorial.Dens"]

[tutorials.PandabornStorage]
order = 34
after = ["PandabornHomes"]
stages = ["PandabornTutorial.Cistern"]

[tutorials.PandabornScience]
order = 37
after = ["PandabornStorage"]
stages = ["PandabornTutorial.Inventor"]

[tutorials.PandabornCooking]
order = 40
after = ["PandabornScience"]
stages = ["PandabornTutorial.Steamer"]

[tutorials.PandabornAfternoon]
order = 50
after = ["PandabornCooking"]
stages = ["PandabornTutorial.Hammock", "PandabornTutorial.Bell"]

[tutorials.PandabornFlumes]
order = 60
after = ["PandabornAfternoon"]
waits_for = "Water"
stages = ["PandabornTutorial.ScoopWheel", "PandabornTutorial.Flume"]

[tutorials.PandabornRingtails]
# a side branch: nothing is `after` it
order = 70
after = ["PandabornFlumes"]
waits_for = "Ringtails"
stages = ["PandabornTutorial.MoonLoft"]

[tutorials.PandabornRicePaddy]
# the Paddy Spout waits for the Water module, so the stage (and with it this tutorial) is left out without it
order = 65
after = ["PandabornFlumes"]
stages = ["PandabornTutorial.Paddy"]

[tutorials.PandabornTea]
# never in front of the flumes or the paddies: with the Water module off the generator chains it to the afternoon instead
order = 80
after = ["PandabornRicePaddy"]
stages = ["PandabornTutorial.TeaGarden", "PandabornTutorial.Roastery", "PandabornTutorial.Tea", "PandabornTutorial.Teahouse"]

[tutorials.PandabornLanternFestival]
order = 90
after = ["PandabornTea"]
waits_for = "Festival"
stages = ["PandabornTutorial.FestivalSquare"]

# ------------------------------------------------------------------------------------------------- stages
[stages."PandabornTutorial.Water"]
steps = [{ BuildingTutorialStepSpec = { TemplateNames = ["WaterPump.Inkpaws"], OnlyFinishedBuildings = false, RequiredAmount = 1 } }]

[stages."PandabornTutorial.Gatherer"]
steps = [{ BuildingTutorialStepSpec = { TemplateNames = ["GathererFlag.Inkpaws"], OnlyFinishedBuildings = false, RequiredAmount = 1 } }]

[stages."PandabornTutorial.ShootBamboo"]
steps = [{ BuildingTutorialStepSpec = { TemplateNames = ["EfficientFarmHouse.Inkpaws"], OnlyFinishedBuildings = false, RequiredAmount = 1 } },
         { MarkPlantablesTutorialStepSpec = { TemplateName = "PandabornShootBamboo.Inkpaws", RequiredAmount = 6 } }]

# PandabornTutorial.FirstShoots ("have 20 shoots") was taken out on 2026-11-25: colonists eat the shoots, so the step
# could hold the whole chain; its id is retired in ids.lock.json.

[stages."PandabornTutorial.Lumberjack"]
steps = [{ BuildingTutorialStepSpec = { TemplateNames = ["LumberjackFlag.Inkpaws"], OnlyFinishedBuildings = false, RequiredAmount = 1 } },
         { MarkTreesTutorialStepSpec = {} }]

[stages."PandabornTutorial.PoleMill"]
steps = [{ BuildingTutorialStepSpec = { TemplateNames = ["LumberMill.Inkpaws"], OnlyFinishedBuildings = false, RequiredAmount = 1 } },
         { BuildingTutorialStepSpec = { TemplateNames = ["PowerWheel.Inkpaws"], OnlyFinishedBuildings = false, RequiredAmount = 1 } }]

[stages."PandabornTutorial.FirstPoles"]
# "have N of a good" (module Pandaborn.Tutorial, docs/tech/tutorial.md); left out of a build without that module
waits_for = "Tutorial"
steps = [{ PandabornGoodAmountStepSpec = { GoodId = "Plank", Amount = 20 } }]

[stages."PandabornTutorial.TimberBamboo"]
steps = [{ BuildingTutorialStepSpec = { TemplateNames = ["Forester.Inkpaws"], OnlyFinishedBuildings = false, RequiredAmount = 1 } },
         { MarkPlantablesTutorialStepSpec = { TemplateName = "PandabornTimberBamboo.Inkpaws", RequiredAmount = 4 } }]

[stages."PandabornTutorial.Dens"]
steps = [{ BuildingTutorialStepSpec = { TemplateNames = ["PandabornDen.Inkpaws"], OnlyFinishedBuildings = true, RequiredAmount = 2 } }]

[stages."PandabornTutorial.Cistern"]
# water for the first drought: 13 pandas drink 2.1 a day and the first Normal drought lasts 2 to 3 days (tools/balance):
# about 80. One pump (49) and one Small Cistern (40) hold it. The amount step waits for the Tutorial module by itself;
# without it the stage is "build a cistern".
steps = [{ BuildingTutorialStepSpec = { TemplateNames = ["PandabornCisternSmall.Inkpaws", "PandabornCisternMedium.Inkpaws"], OnlyFinishedBuildings = true, RequiredAmount = 1 } },
         { waits_for = "Tutorial", PandabornGoodAmountStepSpec = { GoodId = "Water", Amount = 80 } }]

[stages."PandabornTutorial.Inventor"]
# as the vanilla Forester stage: build, gather the science, unlock (here: the Steamer's 40)
steps = [{ BuildingTutorialStepSpec = { TemplateNames = ["Inventor.Inkpaws"], OnlyFinishedBuildings = true, RequiredAmount = 1 } },
         { AccumulateScienceForBuildingStepSpec = { TemplateName = "PandabornSteamer.Inkpaws" } },
         { UnlockBuildingTutorialStepSpec = { TemplateName = "PandabornSteamer.Inkpaws" } }]

[stages."PandabornTutorial.Steamer"]
steps = [{ BuildingTutorialStepSpec = { TemplateNames = ["PandabornSteamer.Inkpaws"], OnlyFinishedBuildings = false, RequiredAmount = 1 } }]

[stages."PandabornTutorial.Hammock"]
steps = [{ BuildingTutorialStepSpec = { TemplateNames = ["PandabornHammock.Inkpaws"], OnlyFinishedBuildings = false, RequiredAmount = 1 } }]

[stages."PandabornTutorial.Bell"]
waits_for = "Bell"
steps = [{ SetWorkingHoursStepSpec = { TargetWorkingHours = 12 } }]

[stages."PandabornTutorial.TeaGarden"]
steps = [{ MarkPlantablesTutorialStepSpec = { TemplateName = "PandabornTeaBush.Inkpaws", RequiredAmount = 4 } }]

[stages."PandabornTutorial.Roastery"]
steps = [{ BuildingTutorialStepSpec = { TemplateNames = ["PandabornTeaRoastery.Inkpaws"], OnlyFinishedBuildings = false, RequiredAmount = 1 } }]

[stages."PandabornTutorial.Tea"]
waits_for = "Tutorial"
steps = [{ PandabornGoodAmountStepSpec = { GoodId = "PandabornTea", Amount = 10 } }]

[stages."PandabornTutorial.Teahouse"]
steps = [{ BuildingTutorialStepSpec = { TemplateNames = ["PandabornTeahouse.Inkpaws"], OnlyFinishedBuildings = false, RequiredAmount = 1 } }]

[stages."PandabornTutorial.ScoopWheel"]
steps = [{ BuildingTutorialStepSpec = { TemplateNames = ["PandabornScoopWheel.Inkpaws"], OnlyFinishedBuildings = false, RequiredAmount = 1 } }]

[stages."PandabornTutorial.Flume"]
steps = [{ BuildingTutorialStepSpec = { TemplateNames = ["PandabornFlume.Inkpaws"], OnlyFinishedBuildings = false, RequiredAmount = 3 } }]

[stages."PandabornTutorial.Paddy"]
steps = [{ BuildingTutorialStepSpec = { TemplateNames = ["PandabornPaddySpout.Inkpaws"], OnlyFinishedBuildings = true, RequiredAmount = 1 } },
         { BuildingTutorialStepSpec = { TemplateNames = ["PandabornPaddyHouse.Inkpaws"], OnlyFinishedBuildings = false, RequiredAmount = 1 } },
         { MarkPlantablesTutorialStepSpec = { TemplateName = "PandabornRice.Inkpaws", RequiredAmount = 6 } }]

[stages."PandabornTutorial.FestivalSquare"]
steps = [{ BuildingTutorialStepSpec = { TemplateNames = ["PandabornFestivalSquare.Inkpaws"], OnlyFinishedBuildings = true, RequiredAmount = 1 } }]

[stages."PandabornTutorial.MoonLoft"]
steps = [{ BuildingTutorialStepSpec = { TemplateNames = ["PandabornMoonLoft.Inkpaws"], OnlyFinishedBuildings = true, RequiredAmount = 1 } }]
