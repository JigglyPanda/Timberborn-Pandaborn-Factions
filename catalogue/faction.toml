# The Inkpaws faction: the faction blueprint, the characters, the bot, the shaft parts, decals and worker outfits.
# Generated into Factions/Pandaborn/, Characters/Pandaborn/, Buildings/Pandaborn/PowerShaft/, Decals/Pandaborn/,
# WorkerOutfits/Pandaborn/ and TemplateCollections/Pandaborn/. Format: catalogue/README.md.

[faction]
id = "Inkpaws"                       # frozen: written into every save
order = 2
avatar = "Sprites/Pandaborn/Avatars/InkpawsAdult"
child_avatar = "Sprites/Pandaborn/Avatars/InkpawsChild"
bot_avatar = "Sprites/Pandaborn/Avatars/InkpawsBot"
contaminated_adult_avatar = "Sprites/Pandaborn/Avatars/InkpawsContaminatedAdult"
contaminated_child_avatar = "Sprites/Pandaborn/Avatars/InkpawsContaminatedChild"
logo = "Sprites/Pandaborn/Avatars/InkpawsLogo"
new_game_full_avatar = "Sprites/Pandaborn/Avatars/InkpawsFullNewGame"
textures = [
  "Materials/Pandaborn/Inkpaws/Adult/InkpawAdult1",
  "Materials/Pandaborn/Inkpaws/Adult/InkpawAdult2",
  "Materials/Pandaborn/Inkpaws/Adult/InkpawAdult3",
  "Materials/Pandaborn/Inkpaws/Adult/InkpawAdult4",
  "Materials/Pandaborn/Inkpaws/Adult/InkpawAdult5",
]
child_textures = [
  "Materials/Pandaborn/Inkpaws/Child/InkpawChild1",
  "Materials/Pandaborn/Inkpaws/Child/InkpawChild2",
  "Materials/Pandaborn/Inkpaws/Child/InkpawChild3",
]
# Keep listing Folktails: the look is applied by the material swap in code (CLAUDE.md, docs/tech/look.md).
material_collections = ["Folktails", "PandabornPlants.Inkpaws"]   # + the plant models' bundle materials
# Collections this catalogue generates (buildings.toml, plants.toml, the characters below). Order is kept.
template_collections = ["Buildings.Inkpaws", "Characters.Inkpaws", "ModularShaftParts.Inkpaws", "NaturalResources.Inkpaws"]
need_collections = ["Needs.Inkpaws"]    # needs.toml [collection]
good_collections = ["Goods.Inkpaws"]    # goods.toml [collection]
path_material = "Buildings/Paths/Path/Path.Folktails"
base_wood_material = "Materials/UberAtlas/Materials/Folktails/BaseWood_White.Folktails"
starting_building = "PandabornVillageHall"   # a building id from buildings.toml
sound_id = "Common"
# Loc keys of the faction texts; the texts themselves are in text/faction.json ("core").
display_name = "Faction.Inkpaws.DisplayName"
description = "Faction.Inkpaws.Description"
game_over_message = "Faction.Inkpaws.GameOver.Message"
game_over_flavor = "Faction.Inkpaws.GameOver.Flavor"

[faction.wonder]
completion_image = "Sprites/Pandaborn/WonderCompletion/wonder-completion-inkpaws"   # the kit lane (models.md pass 4)
launch_sound = "UI.Buildings.Wonder.PandabornSkyLantern"   # sound lane (pandabornsounds bundle)
completion_flavor = "Faction.Inkpaws.WonderCompletionFlavor"
completion_message = "Faction.Inkpaws.WonderCompletionMessage"

# ------------------------------------------------------------------------------------------------- characters
# basis: vanilla blueprint path or template name. path: where the copy goes (no .blueprint.json).
# SimpleLabeledEntitySpec keeps the vanilla label keys on purpose (CharacterBatchControlTab.GetSortingKey throws on
# any other key; the validator enforces it).
[characters.adult]
basis = "Characters/Beaver/BeaverAdult"
template = "InkpawAdult.Inkpaws"
path = "Characters/Pandaborn/InkpawAdult.Inkpaws"
models = { "Model_Preserved" = "Characters/Pandaborn/InkpawAdult.Model" }
name_pool = "inkpaws"   # text/names.json; needs the Names module (left out by -NoCode)
# BaseLiftingCapacity 18 (vanilla 14): settled 2026-11-14 (balance model q1: 3 logs and 6 poles a trip)
set = { "GoodCarrierSpec.BaseLiftingCapacity" = 18 }
# The afternoon bell (src/code/Pandaborn.Bell, DESIGN.md pillar 3): +33% work and walk at a 12 h day or shorter, none at 16 h.
# Proven in stage 0 (docs/tech/stage0.md); the Inkpaws-only MovementSpeed cap is in modifiers.toml.
# Ringtails (docs/tech/two-peoples.md 18.1): the alias is permanent, it lets a save keep its Ringtails (as Inkpaws) whenever
# the module is off
aliases = ["RingtailAdult.Inkpaws"]
module_specs = { Festival = { PandabornFestivalSpec = { LanternGoodId = "PandabornPaperLantern", Lanterns = 40, Dishes = ["PandabornSteamedShoots", "PandabornPickles", "PandabornSteamedRice", "PandabornSweetRiceBalls", "PandabornHotPot", "PandabornBambooSeedCakes"], DishKinds = 3, DishAmount = 20, FireworksGoodId = "Fireworks", Fireworks = 20, FestiveNeedId = "PandabornFestive", GrandNeedId = "PandabornFestiveGrand", KeepWorkingTemplates = ["WaterPump.Inkpaws", "LargeWaterPump.Inkpaws", "MechanicalPump.Inkpaws", "CompactMechanicalPump.Inkpaws", "AquiferDrill.Inkpaws", "PandabornTreadwheelLift.Inkpaws", "PandabornScoopWheel.Inkpaws", "PandabornDewCollector.Inkpaws"], ShowStartHours = 15.5, ShowEndHours = 22.0, FireworksStartHours = 19.0, LanternRises = 24, LanternFireworkIds = ["Firework.CometRed", "Firework.CometWhite"], BurstFireworkIds = ["Firework.KamuroOrange", "Firework.PalmGold", "Firework.KamuroRed", "Firework.Willow", "Firework.PeonyYellowGreen"], Bursts = 20 }, PandabornFestivalGoerSpec = {} }, Flowering = { PandabornFloweringSpec = { Species = ["PandabornShootBamboo.Inkpaws", "PandabornTimberBamboo.Inkpaws"], FirstCycle = 6, NormalMinCycles = 5, NormalMaxCycles = 7, RareMinCycles = 9, RareMaxCycles = 11, RareDelayCycles = 3, SeedDays = 3.0, DormantDays = 9.0, DefaultSetting = "normal" } }, Ringtails = { PandabornRingtailsSpec = { AdultBlueprint = "Characters/Pandaborn/RingtailAdult.Inkpaws.blueprint", ChildBlueprint = "Characters/Pandaborn/RingtailChild.Inkpaws.blueprint", WorkerType = "PandabornRingtail", ArrivalAdults = 2, ArrivalKits = 1 } }, Bell = { PandabornBellSpec = { WorkingSpeedCurve = [{ Hours = 12, Bonus = 0.33 }, { Hours = 16, Bonus = 0.0 }], MovementSpeedCurve = [{ Hours = 12, Bonus = 0.33 }, { Hours = 16, Bonus = 0.0 }], SuggestionDay = 4, SuggestionMinimumDay = 3, SuggestionLocKey = "Pandaborn.Bell.Suggestion", EndBellSoundId = "Environment.Pandaborn.ShiftBell.End", DawnBellSoundId = "Environment.Pandaborn.ShiftBell.Dawn" } } }

[characters.child]
basis = "Characters/Beaver/BeaverChild"
template = "InkpawChild.Inkpaws"
path = "Characters/Pandaborn/InkpawChild.Inkpaws"
models = { "Model_Preserved" = "Characters/Pandaborn/InkpawChild.Model" }
name_pool = "inkpaws"   # text/names.json; needs the Names module (left out by -NoCode)
aliases = ["RingtailChild.Inkpaws"]   # permanent (see the adult)
module_specs = { Festival = { PandabornFestivalGoerSpec = {} } }

[characters.ringtail_adult]
# The Ringtails (docs/tech/two-peoples.md 18.1): made by the Ringtails module from this blueprint path, so in no template
# collection (exactly one AdultSpec per faction). Red panda body from the ringtail-body lane, its size baked in.
# Walks at Inkpaw speed and keeps it loaded (BaseSlowedSpeed = BaseWalkingSpeed); lifts 14; shorter legs animate 1.25x.
basis = "Characters/Beaver/BeaverAdult"
template = "RingtailAdult.Inkpaws"
path = "Characters/Pandaborn/RingtailAdult.Inkpaws"
models = { "Model_Preserved" = "Characters/Pandaborn/RingtailAdult.Model" }
name_pool = "ringtails"
in_collection = false
waits_for = "Ringtails"
set = { "WorkerSpec.WorkerType" = "PandabornRingtail", "GoodCarrierSpec.BaseLiftingCapacity" = 14, "WalkerSpeedManagerSpec.BaseSlowedSpeed" = 2.7, "MovementAnimatorSpec.AnimationSpeedScale" = 1.25 }
module_specs = { Festival = { PandabornFestivalGoerSpec = {} }, Ringtails = { PandabornRingtailSpec = { Kind = "Ringtail", Textures = ["Materials/Pandaborn/Ringtails/Adult/RingtailAdultCoat1", "Materials/Pandaborn/Ringtails/Adult/RingtailAdultCoat2", "Materials/Pandaborn/Ringtails/Adult/RingtailAdultCoat3", "Materials/Pandaborn/Ringtails/Adult/RingtailAdultCoat4", "Materials/Pandaborn/Ringtails/Adult/RingtailAdultCoat5"], Avatar = "Sprites/Pandaborn/Avatars/RingtailAdult", ContaminatedAvatar = "Sprites/Pandaborn/Avatars/RingtailContaminatedAdult", RestStartHours = 0.0, RestEndHours = 8.0, RestEndsAtBell = true, RestMinEndHours = 4.0, RestMaxEndHours = 16.0, SleepBelow = 0.55 } } }

[characters.ringtail_child]
basis = "Characters/Beaver/BeaverChild"
template = "RingtailChild.Inkpaws"
path = "Characters/Pandaborn/RingtailChild.Inkpaws"
models = { "Model_Preserved" = "Characters/Pandaborn/RingtailChild.Model" }
name_pool = "ringtails"
in_collection = false
waits_for = "Ringtails"
set = { "WalkerSpeedManagerSpec.BaseSlowedSpeed" = 1.35, "MovementAnimatorSpec.AnimationSpeedScale" = 1.0 }
module_specs = { Festival = { PandabornFestivalGoerSpec = {} }, Ringtails = { PandabornRingtailSpec = { Kind = "Ringtail", Textures = ["Materials/Pandaborn/Ringtails/Child/RingtailChildCoat1", "Materials/Pandaborn/Ringtails/Child/RingtailChildCoat2", "Materials/Pandaborn/Ringtails/Child/RingtailChildCoat3"], Avatar = "Sprites/Pandaborn/Avatars/RingtailChild", ContaminatedAvatar = "Sprites/Pandaborn/Avatars/RingtailContaminatedChild", RestStartHours = 0.0, RestEndHours = 8.0, RestEndsAtBell = true, RestMinEndHours = 4.0, RestMaxEndHours = 16.0, SleepBelow = 0.55 } } }

[worker_types.PandabornRingtail]
# Saves store a workplace's worker type and the game throws on an unknown one: this ships in every build, forever.
ignores_working_hours = true

[characters.bot]
# The Wooden Ox. Body, material and hats stay the Folktails bot's for now.
basis = "Bot.Folktails"
template = "Bot.Inkpaws"
path = "Characters/Pandaborn/Bot.Inkpaws"
# lift 30 (vanilla 20) and 90 days before it wears out (vanilla 70): settled 2026-11-14 (DESIGN.md, the Wooden Ox)
set = { "NumberedEntityNamerSpec.FormatLocKey" = "Bot.DisplayName.Inkpaws", "GoodCarrierSpec.BaseLiftingCapacity" = 30, "DeteriorableSpec.DeteriorationInDays" = 90 }

[shaft_parts]
basis = "Buildings/Power/PowerShaft/Models/ModularShaftParts.Folktails"
path = "Buildings/Pandaborn/PowerShaft/ModularShaftParts.Inkpaws"

# ------------------------------------------------------------------------------- faction-keyed copies
# Every vanilla DecalSpec / WorkerOutfitSpec of this faction is copied with FactionId = Inkpaws.
[decals]
# The faction's own tails and banners (DESIGN.md 2026-11-14: no beaver tails on panda banners). A decal's id is its
# texture's asset name; every PNG in the folder becomes one DecalSpec for Inkpaws.
own = { Tails = "Materials/Pandaborn/Decals/Tails", Banners = "Materials/Pandaborn/Decals/Banners" }

# ------------------------------------------------------------------------------------------ tool groups
# Bottom-bar groups of our own (BlockObjectToolGroupSpec; empty groups are hidden by the game). name_key = an entry of
# text/faction.json "toolbar" (by suggested_key). The icon comes from the icons lane (docs/tech/icons.md).
[tool_groups.PandabornNightWatch]
order = 105                                   # after Wellbeing (100), before Monuments (120)
name_key = "Pandaborn.ToolGroups.NightWatch"
icon = "Sprites/Pandaborn/Buildings/PandabornMoonLoftIcon"   # until the icons lane draws a bottom-bar moon
waits_for = "Ringtails"
note = "every Ringtail building, marked with the moon"

[outfits]
copy_faction = "Folktails"
# the Ringtails' outfits: the Beaver ones for worker type PandabornRingtail; the builder wears the night builder overlay
# and the courier and forager their own overlays (ringtail-body lane, docs/tech/ringtail-body.md 7.3; head-wraps, never
# vanilla hats: they clip the ears). Stargazer and Opera overlays wait for the Star Tower and Opera Stage.
extra = [
  { copy = "Builder", worker_type = "PandabornRingtail", set = { DiffuseTexture = "Materials/Pandaborn/Outfits/Ringtail/RingtailNightBuilder_D", NormalTexture = "Materials/Pandaborn/Outfits/Ringtail/RingtailNightBuilder_N" } },
  { copy = "Hauler", worker_type = "PandabornRingtail", set = { DiffuseTexture = "Materials/Pandaborn/Outfits/Ringtail/RingtailNightCourier_D", NormalTexture = "Materials/Pandaborn/Outfits/Ringtail/RingtailNightCourier_N" } },
  { copy = "Gatherer", worker_type = "PandabornRingtail", set = { DiffuseTexture = "Materials/Pandaborn/Outfits/Ringtail/RingtailNightForager_D", NormalTexture = "Materials/Pandaborn/Outfits/Ringtail/RingtailNightForager_N" } },
]
