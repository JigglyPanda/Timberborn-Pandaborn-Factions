# Every Inkpaws building. One line each where possible. Format and every field: catalogue/README.md.
#
#   Id = {}                              re-themed: a copy of <Id>.Folktails as template <Id>.Inkpaws, vanilla names
#                                        and stats (the material swap gives it the Inkpaw look)
#   Id = { basis = "Grill.Folktails" }   a building of our own on a vanilla stand-in (model and behaviour of the basis
#                                        until its own model and numbers arrive); Id is its frozen template base name
#   fields: basis, archetype, text, cost, science, workers, worker_type, disallow_other_workers, recipes, capacity,
#           tool_group, tool_order, models, icon, retire, aliases, set, standin, needs_code, note
#
# Text (names, descriptions, flavor) comes from text/buildings.json, matched by "id" (or by `text = "<id>"`).
# Every building lands in the template collection Buildings.Inkpaws in the order written here.

