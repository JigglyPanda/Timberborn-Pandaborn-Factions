# Inkpaws plants (imported from the stat sheet, see goods.toml). basis = the vanilla plant copied: its model
# is the stand-in until the growth-stage models exist. planter = PlantableSpec.ResourceGroup (Farmhouse, Forester,
# AquaticFarmhouse). wet_days adds the arid rule (dies on moist soil) and drops WateredNaturalResourceSpec.

[collection]
id = "NaturalResources.Inkpaws"
# vanilla plants kept beyond the Common collection (birch, oak, pine, blueberry, succulent): dandelion feeds the antidote
vanilla = ["Dandelion"]


[plants.PandabornShootBamboo]
basis = "Carrot"
plant_hours = 0.2
growth_days = 3
cut_yield = { PandabornBambooShoots = 2 }
cut_hours = 1.0
dry_days = 5
flood_min = 0
flood_max = 0
flood_days = 2.0
src = { GrowthTimeInDays = "M q1", Yield = "M q1", DaysToDieDry = "M q1/q4", PlantTimeInHours = "V", RemovalTimeInHours = "G", Water = "V" }

